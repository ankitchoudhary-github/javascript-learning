<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DOM Manipulation - Light Bulb</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f7fb;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    text-align:center;
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
    width:350px;
}

h1{
    margin-bottom:10px;
    color:#333;
}

p{
    color:#666;
    margin-bottom:25px;
}

.bulb{
    width:120px;
    height:120px;
    margin:auto;
    border-radius:50%;
    background:#cfcfcf;
    border:5px solid #999;
    transition:.3s;
}

.bulb.on{
    background:#ffd84d;
    box-shadow:
        0 0 20px #ffd84d,
        0 0 40px #ffd84d,
        0 0 70px #ffd84d;
    border-color:#ffb300;
}

.holder{
    width:45px;
    height:35px;
    background:#666;
    margin:auto;
    border-radius:0 0 8px 8px;
}

button{
    margin-top:35px;
    padding:14px 30px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:17px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#1d4ed8;
}

.status{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
}

.code-box{
    margin-top:25px;
    background:#f3f4f6;
    padding:15px;
    border-radius:10px;
    font-size:14px;
    text-align:left;
    color:#444;
}
</style>

</head>
<body>

<div class="container">

    <h1>DOM Manipulation Demo</h1>
    <p>Click the switch to turn the bulb ON/OFF.</p>

    <div id="bulb" class="bulb"></div>
    <div class="holder"></div>

    <button id="switchBtn">
        Turn ON
    </button>

    <div id="status" class="status">
        💡 Bulb is OFF
    </div>

    <div class="code-box">
        DOM Used:
        <br><br>
        ✔ getElementById()<br>
        ✔ addEventListener()<br>
        ✔ classList.toggle()<br>
        ✔ textContent
    </div>

</div>

<script>

// Select DOM Elements
const bulb = document.getElementById("bulb");
const button = document.getElementById("switchBtn");
const status = document.getElementById("status");

// Variable to store bulb state
let isOn = false;

// Event Listener
button.addEventListener("click", function(){

    // Toggle value
    isOn = !isOn;

    // Add/Remove CSS class
    bulb.classList.toggle("on");

    // Change text using DOM
    if(isOn){
        button.textContent = "Turn OFF";
        status.textContent = "💡 Bulb is ON";
    }else{
        button.textContent = "Turn ON";
        status.textContent = "💡 Bulb is OFF";
    }

});

</script>

</body>
</html>
